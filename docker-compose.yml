services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rabbit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rabbit_pass}
      POSTGRES_DB: ${POSTGRES_DB:-rabbit_nursery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rabbit_user} -d ${POSTGRES_DB:-rabbit_nursery}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rabbit_user}:${POSTGRES_PASSWORD:-rabbit_pass}@postgres:5432/${POSTGRES_DB:-rabbit_nursery}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SENSOR_PORT: ${SENSOR_PORT:-/dev/ttyUSB0}
      SENSOR_BAUD_RATE: ${SENSOR_BAUD_RATE:-9600}
      SENSOR_SAVE_INTERVAL_MS: ${SENSOR_SAVE_INTERVAL_MS:-60000}
      SENSOR_ID: ${SENSOR_ID:-DHT11_01}
      IS_CONTROLLER_CONNECTED: ${IS_CONTROLLER_CONNECTED:-}
      SENSOR_API_KEY: ${SENSOR_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Serial hardware (Linux host): set IS_CONTROLLER_CONNECTED=1 and uncomment:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

volumes:
  postgres_data:
